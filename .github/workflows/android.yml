name: Build Terraria APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP not found"
            exit 1
          fi
          mkdir buildsrc
          unzip -q "$ZIP" -d buildsrc
          ls -la buildsrc/TerrariaAutoBuilder

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd buildsrc/TerrariaAutoBuilder
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TerrariaAutoBuilder-APK
          path: buildsrc/TerrariaAutoBuilder/app/build/outputs/apk/debug/app-debug.apk
